<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to your ledger…</title>
</head>
<body>
  <p>Redirecting to your ledger…</p>
  <script>
    // Static OAuth relay page.
    // Host this file ONCE on a free stable host (GitHub Pages / Cloudflare
    // Pages / Netlify). Register its URL in Google Console as the redirect URI
    // and set OAUTH_REDIRECT_URI in the server's .env to the same URL.
    //
    // Flow: after Google login, Google sends the user here with ?code=&state=.
    // The current cloudflared tunnel origin is embedded in `state` (after the
    // first "|"). We forward the user back to <origin>/auth/callback with the
    // code + state so the server can finish the login.
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("error")) {
        document.body.innerText = "Login error: " + params.get("error");
        return;
      }
      var code = params.get("code");
      var state = params.get("state");
      if (!code || !state) {
        document.body.innerText = "Login failed: missing code or state.";
        return;
      }
      var idx = state.indexOf("|");
      if (idx < 0) {
        document.body.innerText = "Login failed: invalid state.";
        return;
      }
      var origin = state.slice(idx + 1).replace(/\/$/, "");
      var target = origin + "/auth/callback?code=" + encodeURIComponent(code) +
                   "&state=" + encodeURIComponent(state);
      location.replace(target);
    })();
  </script>
</body>
</html>
