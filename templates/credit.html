{% extends "base.html" %}
{% block title %}Credit{% endblock %}
{% block content %}
<h2>Credits</h2>
<form method="post" action="/api/credit/entry">
  <input name="party" placeholder="Party">
  <input name="description" placeholder="Description">
  <input name="amount" type="number" step="0.01" placeholder="Amount">
  <select name="side">
    <option value="G">Given</option>
    <option value="R">Received</option>
  </select>
  <button type="submit">Add</button>
</form>
<ul>
  {% for c in summary.entries %}
    <li>{{ c.credit_date }} — {{ c.party }} — {{ c.side }}: {{ c.amount }}</li>
  {% else %}
    <li>No credits yet.</li>
  {% endfor %}
</ul>
{% endblock %}
